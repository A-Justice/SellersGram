# Production overrides (environment name in Firebase console: "production")
# Merged on top of apphosting.yaml — values here win when both define the same variable.
env:
  - variable: NEXT_PUBLIC_APP_URL
    value: "https://vendorsgram.com"
    availability:
      - BUILD
      - RUNTIME

  # Production uses the default Firestore database (shared Auth, isolated data).
  - variable: NEXT_PUBLIC_FIRESTORE_DATABASE
    value: "(default)"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY
    secret: LIVE_PAYSTACK_PUBLIC_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: PAYSTACK_SECRET_KEY
    secret: LIVE_PAYSTACK_SECRET_KEY
    availability:
      - RUNTIME

  # Same secret names as base apphosting.yaml — set values in GCC / App Hosting secrets.
  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability:
      - RUNTIME

  - variable: MNOTIFY_API_KEY
    secret: MNOTIFY_API_KEY
    availability:
      - RUNTIME

  - variable: MNOTIFY_SENDER_ID
    value: "VendorsGram"
    availability:
      - RUNTIME
